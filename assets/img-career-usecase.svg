  <!-- HR/HRD 카드 (좌하) -->
  <rect x="60" y="138" width="164" height="70" rx="10" fill="white" stroke="#DBEAFE" stroke-width="2"/>
  <text x="142" y="156" text-anchor="middle" font-size="11">🎓</text>
  <text x="142" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">HR / HRD</text>
