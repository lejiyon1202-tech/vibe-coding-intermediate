  <text x="400" y="120" text-anchor="middle" font-size="11" font-weight="800" fill="white">Code</text>

  <!-- 연결선 -->
  <line x1="364" y1="85" x2="222" y2="58" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="364" y1="130" x2="222" y2="162" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="436" y1="85" x2="578" y2="58" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="436" y1="130" x2="578" y2="162" stroke="#93C5FD" stroke-width="1.5"/>

  <!-- 개발자 카드 (좌상) -->
  <rect x="60" y="34" width="164" height="70" rx="10" fill="white" stroke="#DBEAFE" stroke-width="2"/>
  <text x="142" y="52" text-anchor="middle" font-size="11">💻</text>
  <text x="142" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">개발자</text>
