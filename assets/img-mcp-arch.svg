<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200"
     font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

  <!-- 배경 -->
  <rect width="800" height="200" fill="#EFF6FF" rx="12"/>

  <!-- 제목 -->
  <text x="400" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A" letter-spacing=".5">
    MCP 아키텍처 — Claude ↔ MCP Server ↔ 외부 도구 연결
  </text>

  <!-- Claude 박스 -->
  <rect x="20" y="38" width="130" height="130" rx="12" fill="#1E3A8A"/>
  <text x="85" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="white">Claude</text>
  <text x="85" y="86" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.85)">자연어로 도구 호출</text>
  <rect x="38" y="98" width="94" height="16" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="85" y="110" text-anchor="middle" font-size="8.5" fill="white">/slack 팀 알림 보내줘</text>
  <rect x="38" y="120" width="94" height="16" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="85" y="132" text-anchor="middle" font-size="8.5" fill="white">Drive에서 파일 찾아줘</text>
  <rect x="38" y="142" width="94" height="16" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="85" y="154" text-anchor="middle" font-size="8.5" fill="white">DB 쿼리 실행해줘</text>

  <!-- 화살표 Claude → MCP -->
  <line x1="150" y1="90" x2="188" y2="90" stroke="#2563EB" stroke-width="2"/>
  <polygon points="188,86 196,90 188,94" fill="#2563EB"/>
  <text x="169" y="84" text-anchor="middle" font-size="8" fill="#2563EB" font-weight="700">요청</text>
  <line x1="188" y1="120" x2="150" y2="120" stroke="#10B981" stroke-width="2"/>
  <polygon points="150,116 142,120 150,124" fill="#10B981"/>
  <text x="169" y="134" text-anchor="middle" font-size="8" fill="#10B981" font-weight="700">응답</text>

  <!-- MCP Server 박스 -->
  <rect x="196" y="38" width="140" height="130" rx="12" fill="white" stroke="#DBEAFE" stroke-width="2"/>
  <rect x="196" y="38" width="140" height="36" rx="12" fill="#2563EB"/>
  <rect x="196" y="62" width="140" height="12" fill="#2563EB"/>
  <text x="266" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">MCP Server</text>
  <text x="266" y="90" text-anchor="middle" font-size="9" fill="#475569">프로토콜 변환 레이어</text>
  <rect x="212" y="100" width="108" height="14" rx="4" fill="#EFF6FF"/>
  <text x="266" y="111" text-anchor="middle" font-size="8" fill="#1E3A8A">Tool 등록·관리</text>
  <rect x="212" y="120" width="108" height="14" rx="4" fill="#EFF6FF"/>
  <text x="266" y="131" text-anchor="middle" font-size="8" fill="#1E3A8A">인증·권한 처리</text>
  <rect x="212" y="140" width="108" height="14" rx="4" fill="#EFF6FF"/>
  <text x="266" y="151" text-anchor="middle" font-size="8" fill="#1E3A8A">응답 포맷 표준화</text>

  <!-- 화살표 MCP → 외부 도구들 -->
  <line x1="336" y1="80" x2="368" y2="65" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="364,60 372,63 366,68" fill="#64748B"/>
  <line x1="336" y1="103" x2="368" y2="103" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="368,99 376,103 368,107" fill="#64748B"/>
  <line x1="336" y1="126" x2="368" y2="141" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="364,138 372,141 366,146" fill="#64748B"/>

  <!-- 외부 도구 3종 -->
  <!-- Slack -->
  <rect x="376" y="44" width="120" height="44" rx="8" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="436" y="63" text-anchor="middle" font-size="11">💬</text>
  <text x="436" y="79" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Slack / 메신저</text>

  <!-- Google Drive -->
  <rect x="376" y="81" width="120" height="44" rx="8" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="436" y="100" text-anchor="middle" font-size="11">📁</text>
  <text x="436" y="116" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Google Drive / 파일</text>

  <!-- DB -->
  <rect x="376" y="118" width="120" height="44" rx="8" fill="white" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="436" y="137" text-anchor="middle" font-size="11">🗄️</text>
  <text x="436" y="153" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Database / API</text>

  <!-- 화살표 → 결과 -->
  <line x1="496" y1="80" x2="528" y2="80" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="496" y1="103" x2="528" y2="103" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="496" y1="126" x2="528" y2="126" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- MCP Registry 박스 -->
  <rect x="528" y="44" width="240" height="130" rx="12" fill="white" stroke="#DBEAFE" stroke-width="2"/>
  <rect x="528" y="44" width="240" height="32" rx="12" fill="#EFF6FF"/>
  <rect x="528" y="64" width="240" height="12" fill="#EFF6FF"/>
  <text x="648" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E3A8A">MCP Registry (공식 허브)</text>
  <text x="648" y="91" text-anchor="middle" font-size="9" fill="#64748B">claudedesktop.com/mcp — 공인 MCP 서버 목록</text>

  <rect x="544" y="102" width="100" height="20" rx="5" fill="#EFF6FF"/>
  <text x="594" y="116" text-anchor="middle" font-size="8.5" fill="#1E3A8A">🔌 공식 GitHub MCP</text>
  <rect x="652" y="102" width="100" height="20" rx="5" fill="#EFF6FF"/>
  <text x="702" y="116" text-anchor="middle" font-size="8.5" fill="#1E3A8A">🔌 공식 Slack MCP</text>
  <rect x="544" y="128" width="100" height="20" rx="5" fill="#EFF6FF"/>
  <text x="594" y="142" text-anchor="middle" font-size="8.5" fill="#1E3A8A">🔌 공식 Jira MCP</text>
  <rect x="652" y="128" width="100" height="20" rx="5" fill="#EFF6FF"/>
  <text x="702" y="142" text-anchor="middle" font-size="8.5" fill="#1E3A8A">🔌 커스텀 사내 MCP</text>

  <!-- 연결 설명 -->
  <rect x="528" y="155" width="240" height="18" rx="5" fill="#DBEAFE"/>
  <text x="648" y="168" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="700">claude mcp add &lt;name&gt; &lt;command&gt; — 한 줄로 연결</text>

</svg>
